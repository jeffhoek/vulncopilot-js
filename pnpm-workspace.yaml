allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
# Transitive security pins for open Dependabot alerts. Each key is scoped to
# the vulnerable range and each value is a caret range, so the floor rises past
# the first patched release without crossing a major version. Drop an entry
# once the packages that pull it in raise their own floor past it.
#   - hono, ip-address, fast-uri, @modelcontextprotocol/*: via @mastra/mcp
#   - proxy-addr, qs: via express (@mastra/core, @mastra/mcp)
#   - @grpc/grpc-js: via @a2a-js/sdk and the OTLP gRPC exporters
#   - undici: via @ai-sdk/provider-utils
#   - zod@4 below 4.6.6: via @modelcontextprotocol/core (@mastra/mcp) and @mastra/schema-compat
#   - js-yaml@3: via gray-matter (@mastra/core); js-yaml@4: via eslint (dev)
#   - source-map-js: via postcss (next, and vite in dev)
#   - vite: via vitest (dev)
#   - brace-expansion@1 and @5: via minimatch (eslint, typescript-eslint; dev)
overrides:
  '@grpc/grpc-js@>=1.14.0 <1.14.5': ^1.14.5
  '@modelcontextprotocol/client@>=2.0.0 <2.3.0': ^2.3.0
  '@modelcontextprotocol/sdk@>=1.0.0 <1.32.0': ^1.32.0
  '@modelcontextprotocol/server@>=2.0.0 <2.3.0': ^2.3.0
  '@modelcontextprotocol/server-legacy@>=2.0.0 <2.3.1': ^2.3.1
  brace-expansion@>=1.0.0 <1.1.21: ^1.1.21
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  hono: ^4.13.11
  ip-address@<10.7.1: ^10.7.1
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  proxy-addr@>=1.1.0 <2.0.8: ^2.0.8
  qs@>=2.2.5 <6.16.0: ^6.16.0
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  undici@>=7.0.0 <7.30.1: ^7.30.1
  vite@>=7.0.0 <7.3.7: ^7.3.7
  zod@>=4.0.0 <4.6.6: ^4.6.6
